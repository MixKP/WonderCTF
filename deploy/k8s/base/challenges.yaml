# All ten OWASP Top 10 challenge services. Each is a single-container
# Deployment + ClusterIP Service. None of them are granted any ingress or
# egress beyond DNS by the NetworkPolicies in networkpolicies.yaml — they
# cannot reach the platform database, the platform API, or each other.
# Local access is via `kubectl port-forward`, which bypasses NetworkPolicy
# enforcement entirely (see deploy/k8s/README.md).
apiVersion: v1
kind: Service
metadata:
  name: a01-broken-access-control
  namespace: ctf-demo
  labels: { app: a01-broken-access-control }
spec:
  selector: { app: a01-broken-access-control }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a01-broken-access-control
  namespace: ctf-demo
  labels: { app: a01-broken-access-control }
spec:
  replicas: 1
  selector: { matchLabels: { app: a01-broken-access-control } }
  template:
    metadata: { labels: { app: a01-broken-access-control } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: challenge
          image: ctf/a01-broken-access-control:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 2, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
---
